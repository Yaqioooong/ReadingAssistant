services:
  postgres:
    image: postgres:16-alpine
    container_name: reading_assistant_postgres
    environment:
      POSTGRES_USER: psql_reading
      POSTGRES_PASSWORD: psql_reading
      POSTGRES_DB: reading_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psql_reading -d reading_agent"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
