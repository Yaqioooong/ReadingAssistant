[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "readingassistant"
version = "0.1.0"
description = "ReadingAssistant - 阅读 Agent：解析电子书并通过 RAG 回答人物/事件问题"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain==1.2.12",
    "langchain-core==1.2.18",
    "langchain-community==0.4.1",
    "langchain-classic==1.0.2",
    "langchain-text-splitters==1.1.1",
    "langchain-experimental==0.4.1",
    "langgraph==1.1.2",
    "langgraph-prebuilt==1.0.8",
    "langgraph-checkpoint==4.0.1",
    "langgraph-checkpoint-postgres==3.0.5",
    "langgraph-sdk==0.3.9",
    "langgraph-cli[inmem]==0.4.30",
    "mcp==1.27.0",
    "fastmcp==3.2.4",
    "langchain-mcp-adapters==0.2.1",
    "openai==2.26.0",
    "anthropic==0.84.0",
    "langchain-openai==1.1.11",
    "langchain-deepseek==1.0.1",
    "langchain-anthropic==1.3.4",
    "langchain-openrouter==0.1.0",
    "openrouter==0.7.11",
    "dashscope==1.25.6",
    "tencentcloud-sdk-python==3.1.86",
    "PyJWT==2.10.1",
    "langchain-tavily==0.2.17",
    "fastapi==0.135.1",
    "uvicorn==0.46.0",
    "sse-starlette==3.3.4",
    "httpx==0.28.1",
    "httpx-sse==0.4.3",
    "aiohttp==3.12.14",
    "requests==2.32.5",
    "requests-toolbelt==1.0.0",
    "websockets==16.0",
    "watchfiles==1.1.1",
    "python-dotenv==1.2.1",
    "pydantic==2.12.5",
    "pydantic-settings==2.12.0",
    "PyYAML==6.0.3",
    "orjson==3.11.7",
    "jsonschema==4.26.0",
    "jsonref==1.1.0",
    "dataclasses-json==0.6.7",
    "loguru==0.7.3",
    "rich==14.3.3",
    "typer==0.24.1",
    "click==8.3.1",
    "tenacity==9.1.4",
    "tqdm==4.67.3",
    "python-dateutil==2.9.0.post0",
    "pytz==2026.2",
    "langchain-milvus==0.3.3",
    "pymilvus==2.6.12",
    "psycopg[binary]==3.3.3",
    "psycopg-pool==3.3.0",
    "SQLAlchemy==2.0.48",
    "tiktoken==0.12.0",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "nltk==3.9.4",
    "regex==2026.2.28",
    "langdetect==1.0.9",
    "ebooklib==0.19.0",
    "beautifulsoup4==4.13.4",
    "pypdf==5.7.0",
    "python-docx==1.2.0",
    "jieba==0.42.1",
    "rank-bm25==0.2.2",
    "chromadb==1.5.9",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest==9.0.3",
    "pytest-cov",
    "ruff",
]

[project.scripts]
readingassistant = "reading_assistant.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reading_assistant = ["config/*.yml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "postgres: 需要 PostgreSQL 的集成测试",
    "llm: 需要真实 LLM/Embedding 密钥的测试",
]

[tool.coverage.run]
source = ["reading_assistant"]

[tool.coverage.report]
show_missing = true
skip_covered = true
